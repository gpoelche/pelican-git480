    <body>
        <header>
            <h1>Pelican</h1>
            <!-- Logo will go here -->
            <img src="" alt="">

            <!-- For light/dark mode -->
            <button class="theme-toggle"></button>
        </header>

        <main>
            <section id="signup">
                <h2>Signup for Pelican</h2>

                <!-- TO-DO: Add listed requirements for username and password that will be checked upon submission. -->
                <form action="#">
                    <div>
                        <label for="userName">Username</label>
                        <input type="text" id="userName" name="userName">
                    </div>

                    <div>
                        <label for="password">Password</label>
                        <input type="text" id="password" name="password">
                    </div>

                    <div>
                        <label for="securityQuestion">Select Security Question</label>
                        <select name="securityQuestion" id="chooseQuestion">
                            <option value="videogame">What videogame did you first play?</option>
                            <option value="crush">What was the name of your first crush?</option>
                            <option value="pet">What was the name of your first family pet?</option>
                            <option value="bestfriend">What was the name of your first best friend?</option>
                            <option value="book">What is the title of your least favorite book?</option>
                        </select>
                    </div>

                    <div>
                        <label for="securityAnswer">Security Question Answer</label>
                        <input type="text" name="securityAnswer" id="securityAnswer">
                    </div>

                    <p>This is an error container. Messages will be presented here.</p>

                    <div>
                        <input type="submit" value="Login">
                        <p>Already Registered? <a href="login.html">Login</a></p>
                    </div>
                </form>
            </section>
        </main>

        <footer>
            <p>Copyright &copy; 2026 Pelican</p>
            <p>Pelican is a fan-made web application for Stardew Valley. All game content belongs to ConcernedApe.</p>
        </footer>
    </body>
